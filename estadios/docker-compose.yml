services:
  postgres:
    image: postgres:16-alpine
    container_name: estadios_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-estadios_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estadios_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estadios_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT_BACKEND:-4000}:4000"
      - "5555:5555" # Prisma Studio
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/estadios_db?schema=public}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: estadios_frontend_admin
    restart: always
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules

  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: estadios_frontend_client
    restart: always
    ports:
      - "3002:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend-client:/app
      - /app/node_modules

  frontend-validator:
    build:
      context: ./frontend-validator
      dockerfile: Dockerfile
    container_name: estadios_frontend_validator
    restart: always
    ports:
      - "3003:3000"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend-validator:/app
      - /app/node_modules

volumes:
  postgres_data: